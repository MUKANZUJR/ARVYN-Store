<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | ARVYN Store</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .checkout-container {
            padding: 3rem 10%;
        }
        
        form {
            max-width: 600px;
            margin: 0 auto;
            background: #f9f9f9;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }
        
        form h3 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-top: 1rem;
            font-weight: 600;
        }
        
        input,
        textarea {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        button {
            margin-top: 1.5rem;
            width: 100%;
        }
        
        .summary {
            margin-top: 2rem;
            background: #fff;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        
        .summary h4 {
            margin-bottom: 1rem;
        }
        
        .summary p {
            margin: 0.3rem 0;
        }
    </style>
</head>

<body>
    <header>
        <h1>ARVYN Store</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="checkout.html" class="active">Checkout</a></li>
            </ul>
        </nav>
    </header>

    <section class="checkout-container">
        <form id="checkoutForm">
            <h3>Checkout</h3>

            <label for="name">Full Name</label>
            <input type="text" id="name" required />

            <label for="email">Email</label>
            <input type="email" id="email" required />

            <label for="address">Delivery Address</label>
            <textarea id="address" rows="3" required></textarea>

            <button type="submit">Confirm Order</button>

            <div class="summary" id="orderSummary"></div>
        </form>
    </section>

    <footer>
        <p><strong>ARVYN Store</strong> — Randburg, South Africa</p>
        <p>Thank you for supporting a growing brand!</p>
        <p>
            <a href="policy.html">Policy & Privacy</a> |
            <a href="contact.html">Contact Us</a>
        </p>
        <p>&copy; 2025 ARVYN Store. All rights reserved.</p>
    </footer>


    <script src="script.js"></script>
</body>

</html>
